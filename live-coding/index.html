<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მთის ტურები</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <p class="header__logo">მთის ტურები</p>
    <nav class="header__nav" aria-label="მთავარი მენიუ">
        <a class="header__link" href="#tours">ტურები</a>
        <a class="header__link" href="#contact">კონტაქტი</a>
    </nav>
</header>
<main>
    <section class="hero">
        <h1 class="hero__title">აღმოაჩინე საქართველოს მთები</h1>
    </section>
    <section class="tours" id="tours">
        <h2 class="tours__title">პოპულარული ტურები</h2>
        <div class="tours__grid">
            <article class="tour">
                <div class="tour__image" aria-hidden="true">🏔️</div>
                <h3 class="tour__name">ყაზბეგი</h3>
                <p class="tour__info">2 დღე · 180 ₾</p>
                <span class="tour__badge">-15%</span>
            </article>
            <article class="tour">
                <div class="tour__image" aria-hidden="true">🌲</div>
                <h3 class="tour__name">სვანეთი</h3>
                <p class="tour__info">4 დღე · 420 ₾</p>
                <span class="tour__badge">ახალი</span>
            </article>
            <article class="tour">
                <div class="tour__image" aria-hidden="true">🐎</div>
                <h3 class="tour__name">თუშეთი</h3>
                <p class="tour__info">3 დღე · 350 ₾</p>
            </article>
        </div>
    </section>
    <section class="contact" id="contact">
        <h2 class="contact__title">კონტაქტი</h2>
        <p class="contact__text">მოგვწერე: tours@example.com</p>
    </section>
</main>
<a class="to-top" href="#top" aria-label="გვერდის დასაწყისში დაბრუნება">↑</a>
</body>
</html>
